apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-sidecars
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      istio-injection: enabled
  namespaceSelector:
    matchNames:
      - user
  podMetricsEndpoints:
    - path: /stats/prometheus
      port: http-envoy-prom
      interval: 30s
      scheme: http
