apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268

    processors:
      probabilistic_sampler/100:
        sampling_percentage: 100
      probabilistic_sampler/10:
        sampling_percentage: 10
      batch:
      memory_limiter:
        limit_mib: 1500
        spike_limit_mib: 512
        check_interval: 10s
      attributes/insert:
        actions:
          - key: "cluster"
            value: ""
            action: insert
      k8sattributes:
        auth_type: "serviceAccount"
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        passthrough: false
        pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection
      transform/statuscode:
        trace_statements:
          - context: span
            statements:
              - set(attributes["http.status_code"], attributes["http.status"])
      transform:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["namespace"], resource.attributes["k8s.namespace.name"])
              - set(attributes["container"], resource.attributes["k8s.container.name"])
              - set(attributes["pod"], resource.attributes["k8s.pod.name"])

    exporters:
      jaeger:
        endpoint: "jaeger-collector.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:9464"

    connectors:
      spanmetrics:
        namespace: span.metrics
        dimensions:
          - name: http.method
          - name: http.status_code
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"

    service:
      pipelines:
        traces/prometheus:
          receivers: [otlp, jaeger]
          processors: [memory_limiter, probabilistic_sampler/100, k8sattributes, attributes/insert, transform/statuscode, batch]
          exporters: [spanmetrics]

        traces/jaeger:
          receivers: [otlp, jaeger]
          processors: [memory_limiter, probabilistic_sampler/10, k8sattributes, attributes/insert, transform/statuscode, batch]
          exporters: [jaeger]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]

        metrics/spanmetrics:
          receivers: [spanmetrics]
          processors: [transform, batch]
          exporters: [prometheus]