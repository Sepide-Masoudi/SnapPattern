apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: user
  annotations:
    nginx.ingress.kubernetes.io/limit-req-zone: '$binary_remote_addr zone=mylimit:10m rate=5r/s'
    nginx.ingress.kubernetes.io/limit-req: "5"
    nginx.ingress.kubernetes.io/limit-req-burst: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: ${SERVICE_ENDPOINT}
            pathType: Prefix
            backend:
              service:
                name: ${SERVICE_NAME}
                port:
                  number: ${SERVICE_PORT}
