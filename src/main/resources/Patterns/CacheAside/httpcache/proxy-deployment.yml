apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-proxy-async
  namespace: user
  labels:
    app: pattern
spec:
  replicas: 4
  selector:
    matchLabels:
      app: cache-proxy-async
  template:
    metadata:
      labels:
        app: cache-proxy-async
        pattern-managed: "true"
        pattern-type: "cache-aside"
    spec:
      containers:
        - name: cache-proxy
          image: cache-proxy-async:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_SERVICE
              value: "${BACKEND_SERVICE}"
            - name: BACKEND_PORT
              value: "${BACKEND_PORT}"
            - name: CACHED_ENDPOINTS
              value: "${CACHED_ENDPOINTS}"
            - name: REDIS_URL
              value: "redis://redis.user.svc.cluster.local:6379"
            - name: CACHE_TTL
              value: "${CACHE_TTL}"
            - name: MAX_CONNECTIONS
              value: "${MAX_CONNECTIONS}"