apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-cache-config
  namespace: user
  labels:
    pattern-managed: "true"
    pattern-type: "cache-aside"
data:
  nginx.conf: |
    env BACKEND_SERVICE;
    env BACKEND_PORT;
    env CACHED_ENDPOINTS;

    worker_processes  4;

    events {
      worker_connections 1024;
    }

    http {
      lua_shared_dict service_cache 10m;
      resolver kube-dns.kube-system.svc.cluster.local valid=5s;

      lua_package_path "/usr/local/openresty/lualib/?.lua;;";
      lua_shared_dict cache 10m;

      server {
        listen 80;

        location / {
          content_by_lua_block {
            ngx.req.read_body()

            local cjson = require "cjson"
            local http = require "resty.http"
            local redis = require "resty.redis"

            local cache = redis.new()
            cache:set_timeout(1000)

            local redis_host = "redis-cache.pattern.svc.cluster.local"
            local redis_port = "6379"
            local ok, err = cache:connect(redis_host, redis_port)
            if not ok then
              ngx.log(ngx.ERR, "Failed to connect to Redis: ", err)
              ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            -- Get cache TTL and key prefix
            local cache_ttl = 300
            local cache_key_prefix = "cached-response"

            -- Get backend service info from env
            local backend_service = os.getenv("BACKEND_SERVICE")
            local backend_port = os.getenv("BACKEND_PORT") or "80"

            -- Check if the requested URI is in the list of cacheable endpoints
            local cacheable_endpoints = os.getenv("CACHED_ENDPOINTS") or ""
            local request_uri = ngx.var.request_uri

            local is_cacheable = false

            for endpoint in cacheable_endpoints:gmatch("[^,]+") do
              if ngx.var.uri:find(endpoint, 1, true) == 1 then
                is_cacheable = true
                break
              end
            end

            if is_cacheable then
              local cache_key = cache_key_prefix .. ":" .. request_uri
              local cached_response, err = cache:get(cache_key)

              if cached_response and cached_response ~= ngx.null then
                ngx.log(ngx.INFO, "Cache hit for " .. request_uri)
                ngx.header["X-Cache-Status"] = "HIT"
                ngx.status = 200
                ngx.say(cached_response)
                return
              end

              ngx.log(ngx.INFO, "Cache miss for " .. request_uri)
              local httpc = http.new()
              local res, err = httpc:request_uri("http://" .. backend_service .. ":" .. backend_port .. request_uri, {
                method = "GET"
              })

              if res then
                cache:set(cache_key, res.body)
                cache:expire(cache_key, cache_ttl)

                ngx.header["X-Cache-Status"] = "MISS"
                ngx.status = res.status
                for k, v in pairs(res.headers) do
                  if k:lower() ~= "transfer-encoding" then
                    ngx.header[k] = v
                  end
                end
                ngx.say(res.body)
              else
                ngx.log(ngx.ERR, "Backend request failed: ", err)
                ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
              end
            else
              -- Forward the request to the backend if caching is not enabled for this endpoint
              local httpc = http.new()
              local res, err = httpc:request_uri("http://" .. backend_service .. ":" .. backend_port .. request_uri, {
                method = "GET"
              })
              if res then
                ngx.header["X-Cache-Status"] = "BYPASS"
                ngx.status = res.status
                for k, v in pairs(res.headers) do
                  if k:lower() ~= "transfer-encoding" then
                    ngx.header[k] = v
                  end
                end
                ngx.say(res.body)
              else
                ngx.log(ngx.ERR, "Backend request failed: ", err)
                ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
              end
            end
          }
        }
      }
    }