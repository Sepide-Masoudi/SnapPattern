apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ingress
  namespace: pattern
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/protocols: "http, https"
spec:
  rules:
    - http:
        paths:
          - path: /useractions/login
            pathType: Prefix
            backend:
              service:
                name: teastore-auth-0 
                port:
                  number: 80
          - path: /useractions/logout
            pathType: Prefix
            backend:
              service:
                name: teastore-auth-0 
                port:
                  number: 80
