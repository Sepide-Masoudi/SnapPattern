apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${DEPLOYMENT_NAME}
  labels:
    app: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${DEPLOYMENT_NAME}
  template:
    metadata:
      labels:
        app: ${DEPLOYMENT_NAME}
      annotations:
        instrumentation.opentelemetry.io/inject-python: "otel/otel-operator-instrumentation"
    spec:
      containers:
        - name: proxy-container
          image: proxy-service:local
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq.pattern.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "user"
            - name: RABBITMQ_PASSWORD
              value: "bitnami"
            - name: PROXY_HOST
              value: "proxy-${BACKEND_NAME}.user.svc.cluster.local"
            - name: PROXY_PORT
              value: "80"
            - name: BACKEND_SERVICE
              value: "${BACKEND_NAME}"
            - name: BACKEND_PORT
              value: "${BACKEND_PORT}"
            - name: ENDPOINT_PATHS
              value: "${ENDPOINT_PATHS}"
          ports:
            - containerPort: 80