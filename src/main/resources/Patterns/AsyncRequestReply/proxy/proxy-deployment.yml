apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
      annotations:
        instrumentation.opentelemetry.io/inject-python: "otel/otel-operator-instrumentation"
    spec:
      containers:
        - name: proxy-container
          image: proxy-service:local
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq.pattern.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: PROXY_HOST
              value: "proxy-service.pattern.svc.cluster.local" #"0.0.0.0"
            - name: PROXY_PORT
              value: "80"
          ports:
            - containerPort: 80
