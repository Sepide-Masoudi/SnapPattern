apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
        - name: proxy-container
          image: proxy-service:local
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: PROXY_HOST
              value: "proxy-service.proxy.svc.cluster.local"
            - name: PROXY_PORT
              value: "80"
          ports:
            - containerPort: 80
