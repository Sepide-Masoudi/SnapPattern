# DestinationRule – Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ${SERVICE_NAME}-circuit-breaker
  namespace: user
spec:
  host: ${SERVICE_NAME}.user.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: ${MAX_PENDING_REQUESTS}
      tcp:
        maxConnections: ${MAX_CONNECTIONS}
    outlierDetection:
      consecutive5xxErrors: ${FAILURE_THRESHOLD}
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
# VirtualService – Retry
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ${SERVICE_NAME}-retry
  namespace: user
spec:
  hosts:
    - ${SERVICE_NAME}
  http:
    - route:
        - destination:
            host: ${SERVICE_NAME}
      retries:
        attempts: ${RETRY_ATTEMPTS}
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
