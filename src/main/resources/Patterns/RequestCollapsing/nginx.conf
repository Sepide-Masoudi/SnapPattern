 worker_processes 1;
    events {
      worker_connections 1024;
    }
    http {
      lua_shared_dict collapse_cache 10m;

      server {
        listen 80;

        location / {
          content_by_lua_block {
            local uri = ngx.var.request_uri
            local dict = ngx.shared.collapse_cache

            local cached = dict:get(uri)
            if cached then
              ngx.say(cached)
              return
            end

            local lock = require "resty.lock".new("collapse_cache")
            local elapsed, err = lock:lock(uri)

            if not elapsed then
              ngx.log(ngx.ERR, "Lock failed: ", err)
              ngx.exit(500)
            end

            -- Double-check cache after acquiring lock
            cached = dict:get(uri)
            if cached then
              lock:unlock()
              ngx.say(cached)
              return
            end

            -- Perform actual request
            local http = require "resty.http"
            local httpc = http.new()
            local res, err = httpc:request_uri("http://${BACKEND_SERVICE}" .. uri, {
              method = "GET"
            })

            if not res then
              ngx.log(ngx.ERR, "Failed to get backend response: ", err)
              lock:unlock()
              ngx.exit(500)
            end

            dict:set(uri, res.body, 1)  -- Cache for 1 second
            lock:unlock()
            ngx.say(res.body)
          }
        }
      }
    }