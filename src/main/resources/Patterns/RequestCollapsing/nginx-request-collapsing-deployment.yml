apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-request-collapser
  namespace: pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-request-collapser
  template:
    metadata:
      labels:
        app: nginx-request-collapser
    spec:
      containers:
        - name: nginx
          image: openresty/openresty:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: request-collapsing-config
                  key: BACKEND_SERVICE
          volumeMounts:
            - name: nginx-config
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: request-collapsing-config
            items:
              - key: NGINX_CONF
                path: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-request-collapser
  namespace: pattern
spec:
  selector:
    app: nginx-request-collapser
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
