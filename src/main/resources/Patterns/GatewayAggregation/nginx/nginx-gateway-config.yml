apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: pattern
data:
  nginx.conf: |
    worker_processes  4;

    events {
      worker_connections 1024;
    }

    http {
      lua_shared_dict service_cache 10m;
      resolver kube-dns.kube-system.svc.cluster.local valid=5s;

      server {
        listen 80;

        location = /aggregated {
          content_by_lua_block {
            ngx.req.read_body()

            local cjson = require "cjson"
            local http = require "resty.http"

            local services = {
              { name = os.getenv("SERVICE_1_NAME"), url = "http://" .. os.getenv("SERVICE_1_HOST") .. ":" .. os.getenv("SERVICE_1_PORT") .. os.getenv("SERVICE_1_PATH") },
              { name = os.getenv("SERVICE_2_NAME"), url = "http://" .. os.getenv("SERVICE_2_HOST") .. ":" .. os.getenv("SERVICE_2_PORT") .. os.getenv("SERVICE_2_PATH") },
              { name = os.getenv("SERVICE_3_NAME"), url = "http://" .. os.getenv("SERVICE_3_HOST") .. ":" .. os.getenv("SERVICE_3_PORT") .. os.getenv("SERVICE_3_PATH") }
            }

            local responses = {}
            local httpc = http.new()

            for _, service in ipairs(services) do
              local res, err = httpc:request_uri(service.url, { method = "GET" })
              if res then
                responses[service.name] = cjson.decode(res.body)
              else
                responses[service.name] = { error = "Service unavailable: " .. service.name }
              end
            end

            ngx.say(cjson.encode({ aggregated_data = responses }))
          }
        }
      }
    }
