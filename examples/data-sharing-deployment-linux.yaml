# coordinator-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator-service
  template:
    metadata:
      labels:
        app: coordinator-service
    spec:
      containers:
        - name: coordinator-service
          image: sepidmas/coordinator-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FILTER_URL
              value: http://filter-service:8081
            - name: AGGREGATION_URL
              value: http://aggregation-service:8082
            - name: ANONYMIZATION_URL
              value: http://anonymization-service:8083
            - name: FORMATTING_URL
              value: http://formatting-service:8084
            - name: DATA_PRODUCT_URL
              value: http://data-product-service:8089
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-service
spec:
  selector:
    app: coordinator-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
