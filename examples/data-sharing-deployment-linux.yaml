# Docker image for arm 64 (linux)
# filter-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filter-service
  template:
    metadata:
      labels:
        app: filter-service
    spec:
      containers:
        - name: filter-service
          image: anonymous4science/filter-service:linux
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: AUTH_URL
              value: http://auth-service:8085/auth/validate
---
apiVersion: v1
kind: Service
metadata:
  name: filter-service
spec:
  selector:
    app: filter-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

